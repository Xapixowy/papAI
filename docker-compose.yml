services:
  db:
    image: postgres:latest
    restart: always
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${BIND_IP:-127.0.0.1}:${POSTGRES_PORT}:5432'
    volumes:
      - db_data:/var/lib/postgresql
    networks:
      - pap-ai-network

  redis:
    image: redis:latest
    ports:
      - '${BIND_IP:-127.0.0.1}:${REDIS_PORT}:6379'
    networks:
      - pap-ai-network

  app:
    build:
      context: .
      args:
        APP_VERSION_ARG: ${APP_VERSION}
    restart: always
    depends_on:
      - db
    # ports:
    #   - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT}:${APP_PORT}"
    environment:
      - TZ=${APP_TIMEZONE}
    env_file:
      - .env
    networks:
      - pap-ai-network

volumes:
  db_data:

networks:
  pap-ai-network:
    driver: bridge
